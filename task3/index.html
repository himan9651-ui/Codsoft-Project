<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management System</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#667eea,#764ba2);
      min-height:100vh;
      padding:30px;
    }

    .container{
      max-width:1100px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .form-container{
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
      margin-bottom:20px;
    }

    input, select{
      padding:12px;
      border:2px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    input:focus, select:focus{
      border-color:#667eea;
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    button{
      padding:12px 20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      font-size:15px;
      transition:0.3s;
    }

    .add-btn{
      background:#28a745;
    }

    .update-btn{
      background:#007bff;
    }

    .search-btn{
      background:#ff9800;
    }

    .clear-btn{
      background:#6c757d;
    }

    button:hover{
      opacity:0.9;
      transform:scale(1.03);
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      overflow-x:auto;
    }

    th, td{
      border:1px solid #ddd;
      padding:12px;
      text-align:center;
    }

    th{
      background:#667eea;
      color:white;
    }

    tr:nth-child(even){
      background:#f5f5f5;
    }

    .action-btn{
      padding:8px 12px;
      margin:2px;
      border:none;
      border-radius:5px;
      color:white;
      cursor:pointer;
    }

    .edit{
      background:#17a2b8;
    }

    .delete{
      background:#dc3545;
    }

    .message{
      margin-top:10px;
      font-weight:bold;
      text-align:center;
    }

    .success{
      color:green;
    }

    .error{
      color:red;
    }

    @media(max-width:768px){
      table{
        display:block;
        overflow-x:auto;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>🎓 Student Management System</h1>

    <div class="form-container">

      <input type="text" id="name" placeholder="Student Name">

      <input type="text" id="roll" placeholder="Roll Number">

      <input type="number" id="grade" placeholder="Grade (%)">

      <input type="text" id="course" placeholder="Course">

      <input type="email" id="email" placeholder="Email">

    </div>

    <div class="buttons">

      <button class="add-btn" onclick="addStudent()">Add Student</button>

      <button class="update-btn" onclick="updateStudent()">Update Student</button>

      <button class="search-btn" onclick="searchStudent()">Search Student</button>

      <button class="clear-btn" onclick="clearForm()">Clear</button>

    </div>

    <div class="message" id="message"></div>

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Grade</th>
          <th>Course</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="studentTable"></tbody>

    </table>

  </div>

  <script>

    // Student Class
    class Student {
      constructor(name, roll, grade, course, email) {
        this.name = name;
        this.roll = roll;
        this.grade = grade;
        this.course = course;
        this.email = email;
      }
    }

    // Student Management System Class
    class StudentManagementSystem {

      constructor() {
        this.students = JSON.parse(localStorage.getItem("students")) || [];
      }

      addStudent(student) {
        this.students.push(student);
        this.saveToLocalStorage();
      }

      removeStudent(roll) {
        this.students = this.students.filter(student => student.roll !== roll);
        this.saveToLocalStorage();
      }

      searchStudent(roll) {
        return this.students.find(student => student.roll === roll);
      }

      updateStudent(updatedStudent) {

        const index = this.students.findIndex(
          student => student.roll === updatedStudent.roll
        );

        if(index !== -1) {
          this.students[index] = updatedStudent;
          this.saveToLocalStorage();
          return true;
        }

        return false;
      }

      displayStudents() {

        const table = document.getElementById("studentTable");
        table.innerHTML = "";

        this.students.forEach(student => {

          const row = `
            <tr>
              <td>${student.name}</td>
              <td>${student.roll}</td>
              <td>${student.grade}%</td>
              <td>${student.course}</td>
              <td>${student.email}</td>
              <td>
                <button class="action-btn edit"
                  onclick="editStudent('${student.roll}')">
                  Edit
                </button>

                <button class="action-btn delete"
                  onclick="deleteStudent('${student.roll}')">
                  Delete
                </button>
              </td>
            </tr>
          `;

          table.innerHTML += row;
        });
      }

      saveToLocalStorage() {
        localStorage.setItem("students", JSON.stringify(this.students));
      }
    }

    // Initialize System
    const sms = new StudentManagementSystem();

    // Display existing students
    sms.displayStudents();

    // Show Message
    function showMessage(text, type) {

      const message = document.getElementById("message");

      message.textContent = text;
      message.className = `message ${type}`;

      setTimeout(() => {
        message.textContent = "";
      }, 3000);
    }

    // Validate Form
    function validateForm() {

      const name = document.getElementById("name").value.trim();
      const roll = document.getElementById("roll").value.trim();
      const grade = document.getElementById("grade").value.trim();
      const course = document.getElementById("course").value.trim();
      const email = document.getElementById("email").value.trim();

      if(!name || !roll || !grade || !course || !email) {
        showMessage("❗ All fields are required.", "error");
        return false;
      }

      if(grade < 0 || grade > 100) {
        showMessage("❗ Grade must be between 0 and 100.", "error");
        return false;
      }

      return true;
    }

    // Add Student
    function addStudent() {

      if(!validateForm()) return;

      const name = document.getElementById("name").value.trim();
      const roll = document.getElementById("roll").value.trim();
      const grade = document.getElementById("grade").value.trim();
      const course = document.getElementById("course").value.trim();
      const email = document.getElementById("email").value.trim();

      // Check duplicate roll number
      if(sms.searchStudent(roll)) {
        showMessage("❗ Roll Number already exists.", "error");
        return;
      }

      const student = new Student(
        name,
        roll,
        grade,
        course,
        email
      );

      sms.addStudent(student);

      sms.displayStudents();

      clearForm();

      showMessage("✔️ Student added successfully.", "success");
    }

    // Delete Student
    function deleteStudent(roll) {

      if(confirm("Are you sure you want to delete this student?")) {

        sms.removeStudent(roll);

        sms.displayStudents();

        showMessage("✔️ Student deleted successfully.", "success");
      }
    }

    // Edit Student
    function editStudent(roll) {

      const student = sms.searchStudent(roll);

      if(student) {

        document.getElementById("name").value = student.name;
        document.getElementById("roll").value = student.roll;
        document.getElementById("grade").value = student.grade;
        document.getElementById("course").value = student.course;
        document.getElementById("email").value = student.email;
      }
    }

    // Update Student
    function updateStudent() {

      if(!validateForm()) return;

      const updatedStudent = new Student(
        document.getElementById("name").value.trim(),
        document.getElementById("roll").value.trim(),
        document.getElementById("grade").value.trim(),
        document.getElementById("course").value.trim(),
        document.getElementById("email").value.trim()
      );

      const success = sms.updateStudent(updatedStudent);

      if(success) {

        sms.displayStudents();

        clearForm();

        showMessage("✔️ Student updated successfully.", "success");
      }
      else {
        showMessage("❗ Student not found.", "error");
      }
    }

    // Search Student
    function searchStudent() {

      const roll = prompt("Enter Roll Number to Search:");

      if(!roll) return;

      const student = sms.searchStudent(roll);

      if(student) {

        alert(
          `Student Found ✅

Name: ${student.name}
Roll No: ${student.roll}
Grade: ${student.grade}%
Course: ${student.course}
Email: ${student.email}`
        );
      }
      else {
        alert("❌ Student not found.");
      }
    }

    // Clear Form
    function clearForm() {

      document.getElementById("name").value = "";
      document.getElementById("roll").value = "";
      document.getElementById("grade").value = "";
      document.getElementById("course").value = "";
      document.getElementById("email").value = "";
    }

  </script>

</body>
</html>
